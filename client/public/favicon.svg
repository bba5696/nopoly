<!-- nopoly mark: the lowercase "n" from Outfit (the app's display face) at
     weight 500, converted to outlines. Outlines rather than a <text> element
     because a favicon renders outside the page, where the web font isn't
     loaded and the glyph would silently fall back to a system face.

     One letter, not the whole word: at a 16px tab icon the six-letter
     wordmark works out to roughly 4px tall and reads as a smudge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9366ff" />
            <stop offset="1" stop-color="#6a2fe6" />
        </linearGradient>
    </defs>
    <rect width="64" height="64" rx="15" fill="url(#g)" />
    <!-- Glyph space is y-up, SVG is y-down, hence the negative y scale. -->
    <g fill="#f6f3ff" transform="translate(12.537 49) scale(0.069388 -0.069388)">
        <path
            d="M390 0L390 277Q390 325 359.5 356Q329 387 281 387Q249 387 224 373Q199 359 185 334Q171 309 171 277L128 301Q128 356 152 398.5Q176 441 218.5 465.5Q261 490 314 490Q368 490 410 462.5Q452 435 476 391.5Q500 348 500 301L500 0ZM61 0L61 480L171 480L171 0Z"
        />
    </g>
</svg>
