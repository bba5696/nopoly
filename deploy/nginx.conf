# Nginx site for Nopoly. Install to /etc/nginx/sites-available/nopoly and
# symlink into sites-enabled, then replace YOUR_DOMAIN throughout.
#
# Certbot rewrites this file when it installs the certificate, adding the TLS
# block and the port-80 redirect. Run it *after* putting this in place:
#   sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # The app is one page plus an API on the same origin, so everything goes to
    # the same upstream; only the WebSocket route needs special treatment.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # The login rate limiter buckets by IP, so it needs the real client
        # address — every request looks identical without this.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO. Without the Upgrade/Connection headers the handshake never
    # becomes a WebSocket and the client silently falls back to HTTP polling —
    # the game still "works" but every move lags.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A player sitting on someone else's turn sends nothing for minutes at a
        # time. The 60s default would cut them off mid-game.
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;

        # Buffering delays the small, latency-sensitive frames this app sends.
        proxy_buffering off;
    }

    # Fonts and hashed assets are immutable; let the browser keep them.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 1m;
}
